strategy:
  name: moving_average_timing
  params:
    fast_window: 50
    slow_window: 200
    init_cash: 10000

rebalance:
  frequency: monthly
  target_weights:
    SPY: 0.60
    QQQ: 0.40

dca:
  contribution: 1000
  frequency: MS

dividend:
  mode: cash

tax:
  us:
    dividend_withholding_rate: 0.30

ledger:
  base_currency: TWD
  account_currency: USD
  initial_cash: 10000

leverage:
  enabled: true
  kind: margin_loan
  target_leverage: 1.30
  max_leverage: 1.30
  annual_borrow_rate: 0.065
  maintenance_requirement: 0.35
  min_safety_buffer: 0.25
  deleverage_to: 1.10

dynamic_leverage:
  enabled: true
  trend_window: 200
  volatility_window: 63
  high_volatility: 0.25
  drawdown_guard: -0.10
  crash_guard: -0.20
  risk_on_leverage: 1.30
  neutral_leverage: 1.10
  risk_off_leverage: 1.00
  safety_buffer_guard: 0.30

leveraged_etf_lab:
  family: qqq
  initial_cash: 10000
  actual_start_date: "2011-01-01"
  synthetic_start_date: "1999-03-10"
  grid_step: 0.10
  fast_grid_step: 0.25
  full_grid_step: 0.10
  top_n: 24
  fast_top_n: 12
  high_risk_drawdown: -0.65
  synthetic_failure_drawdown: -0.85
  trend_windows: [100, 200]
  drawdown_guards: [-0.10, -0.20]
  products:
    QQQ:
      leverage: 1.0
      label: QQQ 1x
    QLD:
      leverage: 2.0
      label: QLD 2x
    TQQQ:
      leverage: 3.0
      label: TQQQ 3x

cost_model:
  tw:
    commission_rate: 0.001425
    commission_discount: 0.28
    min_commission: 20.0
    stock_transaction_tax_rate: 0.003
    etf_transaction_tax_rate: 0.001
    slippage_bps: 1.0
  us:
    commission_per_share: 0.0
    min_commission: 0.0
    sec_fee_rate: 0.0000278
    finra_taf_per_share: 0.000166
    finra_taf_cap: 8.30
    slippage_bps: 1.0
  fx:
    spread_bps: 10.0
