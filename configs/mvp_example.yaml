base_currency: TWD
start_date: "2020-01-01"
end_date: "2025-12-31"
benchmark: SPY

universe:
  - ticker: SPY
    name: SPDR S&P 500 ETF
    market: US
    asset_type: etf
    currency: USD
    data_source: yfinance
  - ticker: QQQ
    name: Invesco QQQ ETF
    market: US
    asset_type: etf
    currency: USD
    data_source: yfinance
  - ticker: "0050"
    name: Yuanta Taiwan 50 ETF
    market: TW
    asset_type: etf
    currency: TWD
    data_source: finmind
  - ticker: "2330"
    name: TSMC
    market: TW
    asset_type: stock
    currency: TWD
    data_source: finmind

strategy:
  name: moving_average_timing
  params:
    fast_window: 50
    slow_window: 200
    init_cash: 10000

rebalance:
  frequency: monthly
  target_weights:
    SPY: 0.60
    QQQ: 0.40

dca:
  contribution: 1000
  frequency: MS

dividend:
  mode: cash

tax:
  us:
    dividend_withholding_rate: 0.30

ledger:
  base_currency: TWD
  account_currency: USD
  initial_cash: 10000

leverage:
  enabled: true
  kind: margin_loan
  target_leverage: 1.30
  max_leverage: 1.30
  annual_borrow_rate: 0.065
  maintenance_requirement: 0.35
  min_safety_buffer: 0.25
  deleverage_to: 1.10

cost_model:
  tw:
    commission_rate: 0.001425
    commission_discount: 0.28
    min_commission: 20.0
    stock_transaction_tax_rate: 0.003
    etf_transaction_tax_rate: 0.001
    slippage_bps: 1.0
  us:
    commission_per_share: 0.0
    min_commission: 0.0
    sec_fee_rate: 0.0000278
    finra_taf_per_share: 0.000166
    finra_taf_cap: 8.30
    slippage_bps: 1.0
  fx:
    spread_bps: 10.0
