[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "investment-backtest-lab"
version = "0.1.0"
description = "Research prototype for Taiwan and US investment backtesting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bt==1.1.5",
  "FinMind==1.8.0",
  "fear-greed==0.1.0",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "optuna>=4,<5",
  "pandas>=2.2,<3",
  "plotly>=5.20,<7",
  "pyarrow>=15,<23",
  "PyYAML>=6,<7",
  "quantstats==0.0.81",
  "vectorbt==1.0.0",
  "yfinance==1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/investment_backtest_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
